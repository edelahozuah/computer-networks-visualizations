<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmission and propagation delay</title>
<style>
  :root{
    --ink:#1f1f1f; --ink-2:#5a5a5a; --line:#d9d6cf; --paper:#ffffff; --panel:#f5f4f0;
    --data:#7F77DD; --data-2:#AFA9EC; --data-dark:#3C3489;
    --ack:#9FE1CB; --ack-dark:#0F6E56;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
  main{max-width:1200px;margin:0 auto;padding:20px}
  h1{font-size:1.25rem;font-weight:500;margin:0 0 16px}
  .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
  legend{padding:0 6px;color:var(--ink-2);font-size:.9rem}
  .row{display:grid;grid-template-columns:96px 1fr 84px;align-items:center;gap:10px;margin:8px 0}
  .row label{font-size:.9rem;color:var(--ink-2)}
  .row output{font-size:.9rem;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--data-dark)}
  select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font:inherit}
  .buttons{display:flex;gap:8px}
  button{flex:1;padding:10px 12px;font:inherit;font-size:1rem;border:1px solid var(--ink);border-radius:6px;background:var(--paper);cursor:pointer}
  button:hover{background:var(--panel)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--data-dark);outline-offset:2px}
  #play{background:var(--ink);color:var(--paper)}
  svg{width:100%;height:auto;display:block}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
  @media (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .card{background:var(--panel);border-radius:8px;padding:10px 14px}
  .card p{margin:0;font-size:.85rem;color:var(--ink-2)}
  .card b{font-weight:500;font-size:1.5rem;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:18px;font-size:.85rem;color:var(--ink-2);margin:8px 0 0}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px}
  .hint{font-size:.85rem;color:var(--ink-2);margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>Transmission and propagation delay</h1>
<div class="layout">
<section aria-label="Parameters">
  <fieldset><legend>Link</legend>
    <div class="row"><label for="sL">Size L</label><input type="range" id="sL" min="0" max="300" step="1" value="190"><output id="oL"></output></div>
    <div class="row"><label for="sR">Rate R</label><input type="range" id="sR" min="0" max="300" step="1" value="100"><output id="oR"></output></div>
    <div class="row"><label for="sD">Distance d</label><input type="range" id="sD" min="0" max="400" step="1" value="300"><output id="oD"></output></div>
    <div class="row"><label for="sS">Speed s</label><select id="sS" style="grid-column:2/4"><option value="200000">2·10⁸ m/s (copper, fiber)</option><option value="300000">3·10⁸ m/s (radio, vacuum)</option></select></div>
  </fieldset>
  <fieldset><legend>Exchange</legend>
    <div class="row"><label for="sN">Packets</label><input type="range" id="sN" min="1" max="6" step="1" value="2"><output id="oN">2</output></div>
    <div class="row"><label for="sM">ACK</label><select id="sM" style="grid-column:2/4"><option value="none">No ACK</option><option value="sw" selected>Stop-and-wait</option><option value="pipe">Pipelining</option></select></div>
    <div class="row"><label for="sK">ACK size</label><input type="range" id="sK" min="0" max="200" step="1" value="60"><output id="oK"></output></div>
  </fieldset>
  <fieldset><legend>Playback</legend>
    <div class="row"><label for="sA">Duration</label><input type="range" id="sA" min="2" max="30" step="1" value="6"><output id="oA"></output></div>
    <div class="buttons"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button></div>
    <p class="hint">Spacebar: play or pause. R: reset.</p>
  </fieldset>
</section>

<section aria-label="Diagram">
  <svg id="dia" viewBox="0 0 760 520" role="img" aria-label="Space-time diagram with two time axes, sender and receiver">
    <defs><clipPath id="clipT"><rect id="clipR" x="0" y="0" width="760" height="0"/></clipPath></defs>
    <text x="150" y="26" font-size="17" text-anchor="middle" fill="#5a5a5a">Sender</text>
    <text x="610" y="26" font-size="17" text-anchor="middle" fill="#5a5a5a">Receiver</text>
    <line x1="150" y1="40" x2="150" y2="495" stroke="#1f1f1f" stroke-width="1.5"/>
    <line x1="610" y1="40" x2="610" y2="495" stroke="#1f1f1f" stroke-width="1.5"/>
    <text x="150" y="512" font-size="14" text-anchor="middle" fill="#8a8a8a">time ↓</text>
    <g id="pk" clip-path="url(#clipT)"></g>
    <g id="lab"></g>
    <line id="cur" x1="60" y1="40" x2="700" y2="40" stroke="#1f1f1f" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text id="curT" x="700" y="40" font-size="15" text-anchor="end" fill="#1f1f1f"></text>
  </svg>
  <div class="legend"><span><i style="background:var(--data)"></i>Data</span><span><i style="background:var(--ack)"></i>ACK</span></div>
  <div class="cards">
    <div class="card"><p>Transmission L/R</p><b id="cT"></b></div>
    <div class="card"><p>Propagation d/s</p><b id="cP"></b></div>
    <div class="card"><p>Total time</p><b id="cTot"></b></div>
    <div class="card"><p>Sender utilization</p><b id="cU"></b></div>
  </div>
</section>
</div>
</main>

<script>
(function(){
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const fmtT=t=>t>=1?t.toFixed(2)+' s':t>=1e-3?(t*1e3).toFixed(2)+' ms':(t*1e6).toFixed(1)+' µs';
const fmtN=(v,u)=>{if(v>=1e6)return (v/1e6).toFixed(1)+' M'+u;if(v>=1e3)return (v/1e3).toFixed(1)+' k'+u;return Math.round(v)+' '+u};
const Y0=40,Y1=480,XA=150,XB=610;
let tot=1,dur=6,t=0,playing=false,last=0;
const y=tt=>Y0+(Y1-Y0)*tt/tot;
function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e}
function poly(x1,ta,tb,x2,dP,fill,stroke){return el('polygon',{points:`${x1},${y(ta)} ${x2},${y(ta+dP)} ${x2},${y(tb+dP)} ${x1},${y(tb)}`,fill,stroke,'stroke-width':'1'})}
function br(lab,x,ta,tb,txt,side){
  const x2=x+side*10,ym=(y(ta)+y(tb))/2;
  lab.appendChild(el('path',{d:`M${x2},${y(ta)} H${x2+side*8} V${y(tb)} H${x2}`,fill:'none',stroke:'#5a5a5a','stroke-width':'1.2'}));
  const tx=el('text',{x:x2+side*13,y:ym+5,'font-size':'15',fill:'#5a5a5a','text-anchor':side>0?'start':'end'});tx.textContent=txt;lab.appendChild(tx);
}
function setPlayLabel(){$('play').textContent=playing?'Pause':'Play'}
function params(){
  const L=Math.round(Math.pow(10,$('sL').value/100+2)),R=Math.pow(10,$('sR').value/100)*1e6;
  const d=Math.pow(10,$('sD').value/100),s=+$('sS').value,N=+$('sN').value,mode=$('sM').value;
  const K=$('sK').value==0?0:Math.round(Math.pow(10,$('sK').value/100+1));
  const dT=L/R,dP=d/s,dK=K/R;
  $('oL').textContent=fmtN(L,'bits');$('oR').textContent=fmtN(R,'bps');$('oD').textContent=fmtN(d*1000,'m');$('oN').textContent=N;
  $('oK').textContent=K?fmtN(K,'bits'):'0 (ideal)';
  const pkts=[],acks=[];let ackEnd=0;
  for(let k=0;k<N;k++){
    const st=mode==='sw'?(k===0?0:acks[k-1].arr):k*dT;
    pkts.push({st,en:st+dT,arr:st+dT+dP});
    if(mode!=='none'){const as=Math.max(pkts[k].arr,ackEnd);acks.push({st:as,en:as+dK,arr:as+dK+dP});ackEnd=as+dK;}
  }
  tot=mode==='none'?pkts[N-1].arr:acks[N-1].arr;
  const U=N*dT/tot;
  $('cT').textContent=fmtT(dT);$('cP').textContent=fmtT(dP);$('cTot').textContent=fmtT(tot);
  $('cU').textContent=(U*100).toFixed(U<0.1?2:1)+' %';
  const pk=$('pk'),lab=$('lab');pk.innerHTML='';lab.innerHTML='';
  pkts.forEach((p,k)=>{
    pk.appendChild(poly(XA,p.st,p.en,XB,dP,k%2?'#AFA9EC':'#7F77DD','#534AB7'));
    pk.appendChild(el('line',{x1:XA,y1:y(p.st),x2:XB,y2:y(p.arr),stroke:'#3C3489','stroke-width':'1.5'}));
  });
  acks.forEach(a=>{
    pk.appendChild(poly(XB,a.st,a.en,XA,dP,'#9FE1CB','#0F6E56'));
    pk.appendChild(el('line',{x1:XB,y1:y(a.st),x2:XA,y2:y(a.arr),stroke:'#0F6E56','stroke-width':'1.5'}));
    const cx=(XA+XB)/2,cy=(y(a.st)+y(a.arr))/2;
    const tx=el('text',{x:cx,y:cy-6,'font-size':'14',fill:'#0F6E56','text-anchor':'middle',transform:`rotate(${-Math.atan2(y(a.arr)-y(a.st),XB-XA)*180/Math.PI} ${cx} ${cy})`});tx.textContent='ACK';pk.appendChild(tx);
  });
  br(lab,XA,0,dT,'L/R',-1);
  br(lab,XB,0,dP,'d/s',1);
  if(mode!=='none')br(lab,XA,pkts[0].en,acks[0].arr,'RTT',-1);
  else br(lab,XB,dP,tot,N>1?N+'·L/R':'L/R',1);
  draw();
}
function draw(){
  const yy=y(t);
  $('clipR').setAttribute('height',yy);
  $('cur').setAttribute('y1',yy);$('cur').setAttribute('y2',yy);
  $('curT').setAttribute('y',yy-4);$('curT').textContent='t = '+fmtT(t);
}
function loop(now){
  if(!playing)return;const dt=(now-last)/1000;last=now;
  t=Math.min(tot,t+dt*tot/dur);draw();
  if(t>=tot){playing=false;setPlayLabel();return}
  requestAnimationFrame(loop);
}
function toggle(){
  if(playing){playing=false;setPlayLabel();return}
  if(t>=tot)t=0;playing=true;last=performance.now();setPlayLabel();requestAnimationFrame(loop);
}
function reset(){playing=false;t=0;setPlayLabel();draw()}
$('play').addEventListener('click',toggle);
$('reset').addEventListener('click',reset);
['sL','sR','sD','sS','sN','sM','sK'].forEach(id=>$(id).addEventListener('input',()=>{t=0;playing=false;setPlayLabel();params()}));
$('sA').addEventListener('input',()=>{dur=+$('sA').value;$('oA').textContent=dur+' s'});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='r'||e.key==='R')reset();
});
$('oA').textContent=dur+' s';params();
})();
</script>
</body>
</html>
