<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DNS paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mismo lenguaje visual que HttpPersistente y DrawDelayDiagram: paleta, tipografías y tokens claro/oscuro. */
:root {
  --bg: #f3f6f8; --lienzo: #ffffff; --panel: #ffffff; --fg: #16202a; --muted: #5a6876; --line: #c8d1d9; --suave: #eef2f5;
  --ip: #0f7c8c; --nombre: #7a4fb5; --rec: #c25400; --ite: #1f5fbf; --ref: #b0307a; --bien: #17855a; --mal: #c0392b; --sel: #c97a00;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --lienzo: #121920; --panel: #151c23; --fg: #e2e8ee; --muted: #93a1ae; --line: #34414e; --suave: #1b242d;
    --ip: #3fbfcf; --nombre: #b796ec; --rec: #f0954a; --ite: #6ea3f0; --ref: #e56aa9; --bien: #4cc28d; --mal: #f07b6b; --sel: #f2b63c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --lienzo: #121920; --panel: #151c23; --fg: #e2e8ee; --muted: #93a1ae; --line: #34414e; --suave: #1b242d;
  --ip: #3fbfcf; --nombre: #b796ec; --rec: #f0954a; --ite: #6ea3f0; --ref: #e56aa9; --bien: #4cc28d; --mal: #f07b6b; --sel: #f2b63c;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
.dns * { box-sizing: border-box; }
.dns [hidden] { display: none !important; }
.dns { max-width: 1500px; margin: 0 auto; padding: 10px 16px 30px; font-size: 14px; }
.dns-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
.dns h1 { font-family: var(--display); font-size: 1.25rem; margin: 0; }
.dns h1 span { color: var(--rec); }
.dns-ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dns button, .dns select { font: inherit; font-size: 0.86rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.dns select { max-width: 280px; }
.dns button:hover { border-color: var(--fg); }
.dns button:focus-visible, .dns select:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.dns-cont { font-family: var(--mono); min-width: 6ch; text-align: center; }
#dns-escenario { background: var(--lienzo); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
#dns-escenario:fullscreen { border: 0; border-radius: 0; display: flex; align-items: center; justify-content: center; }
#dns-lienzo { display: block; width: 100%; height: auto; max-height: calc(100vh - 70px); cursor: pointer; user-select: none; }
#dns-escenario:fullscreen #dns-lienzo { width: 100vw; height: 100vh; max-height: none; }
.dns-ayuda { color: var(--muted); font-size: 0.8rem; margin: 6px 0 0; }

/* SVG */
#dns-lienzo text { font-family: var(--body); fill: var(--fg); }
#dns-lienzo .mono { font-family: var(--mono); white-space: pre; }
#dns-lienzo .el { transition: transform .6s ease, opacity .45s ease; }
#dns-lienzo .tit { font-family: var(--display); }
#dns-lienzo .acto { fill: var(--rec); letter-spacing: .08em; text-transform: uppercase; }
#dns-lienzo .ns { fill: var(--muted); }
#dns-lienzo .nt { fill: var(--fg); }
#dns-lienzo .halo { paint-order: stroke; stroke: var(--lienzo); stroke-width: 5px; stroke-linejoin: round; }
#dns-lienzo .c-ip { fill: var(--ip); } #dns-lienzo .c-nombre { fill: var(--nombre); } #dns-lienzo .c-rec { fill: var(--rec); }
#dns-lienzo .c-ite { fill: var(--ite); } #dns-lienzo .c-ref { fill: var(--ref); } #dns-lienzo .c-bien, #dns-lienzo .c-resp { fill: var(--bien); }
#dns-lienzo .c-mal { fill: var(--mal); } #dns-lienzo .c-preg { fill: var(--fg); } #dns-lienzo .c-cache { fill: var(--fg); }
.pie { font-family: var(--body); font-size: 25px; line-height: 1.3; color: var(--fg); border-top: 2px solid var(--line); padding-top: 10px; }
.pie b { color: var(--rec); font-weight: 700; }
#dns-lienzo .nodo { fill: var(--panel); stroke: var(--fg); stroke-width: 1.6; }
#dns-lienzo .nodo.srv { stroke: var(--ip); stroke-width: 2.5; }
#dns-lienzo .nodo.nombre { stroke: var(--nombre); stroke-width: 2.2; }
#dns-lienzo .nodo.ip { stroke: var(--ip); stroke-width: 2; }
#dns-lienzo .nodo.local { stroke: var(--rec); stroke-width: 2.5; }
#dns-lienzo .nodo.cab-vida { fill: var(--suave); stroke: var(--line); }
#dns-lienzo .tarjeta { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
#dns-lienzo .tarjeta.destacada { stroke: var(--fg); stroke-width: 2; }
#dns-lienzo .tarjeta.ip { stroke: var(--ip); }
#dns-lienzo .tarjeta.nombre { stroke: var(--nombre); stroke-width: 2; }
#dns-lienzo .tarjeta.rota { stroke: var(--mal); stroke-width: 2; fill: color-mix(in srgb, var(--mal) 7%, var(--panel)); }
#dns-lienzo .tarjeta.ok { stroke: var(--bien); stroke-width: 2; }
#dns-lienzo .tarjeta.ref { stroke: var(--ref); stroke-width: 2; stroke-dasharray: 7 5; }
#dns-lienzo .tarjeta.rec { stroke: var(--rec); stroke-width: 2.5; }
#dns-lienzo .tarjeta.ite { stroke: var(--ite); stroke-width: 2.5; }
#dns-lienzo .fantasma { fill: none; stroke: var(--mal); stroke-width: 2; stroke-dasharray: 6 5; }
#dns-lienzo .cajanegra { fill: var(--suave); stroke: var(--fg); stroke-width: 2.5; }
#dns-lienzo .equipo { fill: none; stroke: var(--line); stroke-width: 2; }
#dns-lienzo .fichero { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
#dns-lienzo .host { fill: var(--panel); stroke: var(--fg); stroke-width: 1.6; }
#dns-lienzo .nube { fill: var(--suave); stroke: var(--line); stroke-width: 1.5; }
#dns-lienzo .isp { fill: color-mix(in srgb, var(--ip) 5%, transparent); stroke: var(--ip); stroke-width: 1.5; stroke-dasharray: 8 6; }
#dns-lienzo .router { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
#dns-lienzo .enlace { stroke: var(--muted); stroke-width: 2; }
#dns-lienzo .enlace.rec-suave { stroke: var(--rec); opacity: .45; }
#dns-lienzo .enlace.ite-suave { stroke: var(--ite); opacity: .45; }
#dns-lienzo .guia { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
#dns-lienzo .zona { fill: color-mix(in srgb, var(--nombre) 7%, transparent); stroke: var(--nombre); stroke-width: 1.4; stroke-dasharray: 6 5; }
#dns-lienzo .rama { stroke: var(--nombre); stroke-width: 2; opacity: .7; }
#dns-lienzo .rama-ip { stroke: var(--ip); stroke-width: 2; opacity: .7; }
#dns-lienzo .camino { stroke: var(--ref); stroke-width: 5; stroke-linecap: round; }
#dns-lienzo .vida { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; }
#dns-lienzo .banda { stroke: none; }
#dns-lienzo .banda.rec { fill: color-mix(in srgb, var(--rec) 12%, transparent); }
#dns-lienzo .banda.ite { fill: color-mix(in srgb, var(--ite) 9%, transparent); }
#dns-lienzo .fl { stroke-width: 2.6; fill: none; }
#dns-lienzo .fl.fino { stroke-width: 1.6; }
#dns-lienzo .fl.dash { stroke-dasharray: 7 6; }
#dns-lienzo .fl.neutro { stroke: var(--muted); } #dns-lienzo .fl.rec { stroke: var(--rec); } #dns-lienzo .fl.ite { stroke: var(--ite); }
#dns-lienzo .fl.bien { stroke: var(--bien); } #dns-lienzo .fl.mal { stroke: var(--mal); } #dns-lienzo .fl.nombre { stroke: var(--nombre); }
#dns-lienzo .fl.ip { stroke: var(--ip); } #dns-lienzo .fl.ref { stroke: var(--ref); }
#dns-lienzo .punta-neutro { fill: var(--muted); } #dns-lienzo .punta-rec { fill: var(--rec); } #dns-lienzo .punta-ite { fill: var(--ite); }
#dns-lienzo .punta-bien { fill: var(--bien); } #dns-lienzo .punta-mal { fill: var(--mal); } #dns-lienzo .punta-nombre { fill: var(--nombre); }
#dns-lienzo .punta-ip { fill: var(--ip); } #dns-lienzo .punta-ref { fill: var(--ref); }
#dns-lienzo .sobre { fill: var(--lienzo); stroke-width: 2.5; }
#dns-lienzo .sobre.rec { stroke: var(--rec); } #dns-lienzo .sobre.ite { stroke: var(--ite); } #dns-lienzo .sobre.ref { stroke: var(--ref); }
#dns-lienzo .sobre.bien { stroke: var(--bien); }
#dns-lienzo .sobre-t { fill: var(--fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { #dns-lienzo .el { transition: opacity .2s; } }
</style>
</head>
<body>

<div class="dns" id="dns-app">
  <div class="dns-barra">
    <h1>DNS <span>paso a paso</span></h1>
    <div class="dns-ctrl">
      <select id="dns-indice" aria-label="Ir al paso"></select>
      <button id="dns-ant" title="Anterior (←)">◀</button>
      <span class="dns-cont" id="dns-cont"></span>
      <button id="dns-sig" title="Siguiente (→, espacio, clic)">▶</button>
      <button id="dns-rep" title="Repetir la animación (R)">↻ Repetir</button>
      <button id="dns-bfs" title="Pantalla completa (F)">Pantalla completa</button>
      <button id="dns-btema">Tema: auto</button>
    </div>
  </div>
  <div id="dns-escenario">
    <svg id="dns-lienzo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animación del DNS">
      <defs>
        <marker id="dnsm-neutro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-neutro"/></marker>
        <marker id="dnsm-rec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-rec"/></marker>
        <marker id="dnsm-ite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-ite"/></marker>
        <marker id="dnsm-bien" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-bien"/></marker>
        <marker id="dnsm-mal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-mal"/></marker>
        <marker id="dnsm-nombre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-nombre"/></marker>
        <marker id="dnsm-ip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-ip"/></marker>
        <marker id="dnsm-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="punta-ref"/></marker>
      </defs>
      <rect width="1600" height="900" fill="var(--lienzo)"/>
      <g id="dns-capa"></g>
      <g id="dns-vuelos"></g>
    </svg>
  </div>
  <p class="dns-ayuda">→ / espacio / clic: avanzar · ←: retroceder · R: repetir · F: pantalla completa</p>
</div>

<script>
(function () {
'use strict';
// Primitivas de dibujo: devuelven cadenas SVG (sin DOM), para poder probarlas en node.
// Un «elemento» de escena es S(id, x, y, html): un <g> con ese id, desplazado a (x, y).
// Si dos pasos consecutivos comparten id, el motor lo desplaza en vez de redibujarlo.

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function S(id, x, y, html, o = {}) {
  return { id, x, y, html, cls: o.cls || '', d: o.d || 0, op: o.op ?? 1 };
}

// Ancho aproximado de un texto (para dimensionar cajas)
const anchoTexto = (s, size, mono) => String(s).length * size * (mono ? 0.61 : 0.54);

function txt(s, o = {}) {
  const w = o.weight ? ` font-weight="${o.weight}"` : '';
  return `<text x="${o.x || 0}" y="${o.y || 0}" font-size="${o.size || 22}" text-anchor="${o.anchor || 'middle'}" class="${o.cls || ''}"${w}>${o.raw ? s : esc(s)}</text>`;
}

function caja(w, h, o = {}) {
  return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${o.rx ?? 8}" class="${o.cls || 'caja'}"/>`;
}

// Nodo centrado en (0, 0): título y, opcionalmente, subtítulo (monoespaciado salvo subMono:false)
function nodo(titulo, sub, o = {}) {
  const size = o.size || 22, subMono = o.subMono !== false;
  const w = o.w || Math.max(anchoTexto(titulo, size, o.mono), sub ? anchoTexto(sub, 17, subMono) : 0) + 36;
  const h = o.h || (sub ? 70 : 48);
  return caja(w, h, { cls: 'nodo ' + (o.cls || '') }) +
    txt(titulo, { y: sub ? -5 : 8, size, cls: 'nt' + (o.mono ? ' mono' : ''), weight: o.mono ? 500 : 600 }) +
    (sub ? txt(sub, { y: 22, size: 17, cls: (subMono ? 'mono ' : '') + 'ns' }) : '');
}

// Tarjeta con la esquina superior izquierda en (0, 0). Líneas: texto o {t, cls, mono, size, weight}
function tarjeta(lineas, o = {}) {
  const size = o.size || 20, lh = o.lh || Math.round(size * 1.45), pad = o.pad ?? 14;
  const L = lineas.map(l => (typeof l === 'string' ? { t: l } : l));
  const w = o.w || Math.max(...L.map(l => anchoTexto(l.t, l.size || size, l.mono))) + 2 * pad;
  const h = pad + size * 1.1 + (L.length - 1) * lh + pad;
  let s = `<rect width="${w}" height="${h}" rx="8" class="tarjeta ${o.cls || ''}"/>`;
  L.forEach((l, i) => {
    s += txt(l.t, { x: pad, y: pad + size * 0.85 + i * lh, size: l.size || size, anchor: 'start', cls: (l.mono ? 'mono ' : '') + (l.cls || ''), weight: l.weight });
  });
  return s;
}

// Flecha recta; ini/fin acortan los extremos (px)
function flecha(x1, y1, x2, y2, cls = 'neutro', o = {}) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, a = o.ini || 0, b = o.fin || 0;
  const p = [x1 + dx * a / L, y1 + dy * a / L, x2 - dx * b / L, y2 - dy * b / L].map(v => +v.toFixed(1));
  const punta = o.sinPunta ? '' : ` marker-end="url(#dnsm-${cls})"`;
  return `<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" class="fl ${cls}${o.dash ? ' dash' : ''}${o.fino ? ' fino' : ''}"${punta}/>`;
}

// Arco cuadrático (para la cadena del contrafactual recursivo)
function arco(x1, y1, x2, y2, alto, cls) {
  const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - alto;
  return `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" class="fl ${cls}" fill="none" marker-end="url(#dnsm-${cls})"/>`;
}

function linea(x1, y1, x2, y2, cls) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
}

// Mensaje en vuelo: de [x,y] a [x,y], con etiqueta; t = inicio (ms), dur = duración (ms)
const V = (de, a, etiqueta, cls, t = 0, dur = 900) => ({ de, a, etiqueta, cls, t, dur });

// Texto con **negrita** → HTML (para el pie)
const pieHTML = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
// Escenas y narración. Lienzo de 1600 × 900: cabecera hasta y = 90, pie desde y = 812.
// Cada paso: acto, titulo, msg (pie, admite **negrita**), escena() → elementos, vuelos (opcional),
// notas (párrafos de narración), pregunta (al aula, opcional), ojo (precisiones, opcional).

const ACTOS = {
  I: 'Las IP atan',
  II: 'Los nombres',
  III: 'Lo que ve tu equipo',
  IV: 'Detrás del telón',
  V: 'Recursiva e iterativa',
  VI: 'Así se dibuja',
};

function marco(p, i, n) {
  return [
    S('cab-acto', 60, 0, txt(`Acto ${p.acto} · ${ACTOS[p.acto]}`, { y: 36, size: 17, anchor: 'start', cls: 'acto', weight: 600 })),
    S('cab-tit', 60, 0, txt(p.titulo, { y: 74, size: 32, anchor: 'start', cls: 'tit', weight: 700 })),
    S('cab-n', 1540, 0, txt(`${i + 1} / ${n}`, { y: 36, size: 17, anchor: 'end', cls: 'ns' })),
    S('pie', 0, 0, `<foreignObject x="60" y="814" width="1480" height="80"><div xmlns="http://www.w3.org/1999/xhtml" class="pie">${pieHTML(p.msg)}</div></foreignObject>`),
  ];
}

const tenue = (els, op = 0.18) => els.map(e => ({ ...e, op }));

// ───────────── Actos I y II: el mapa de red ─────────────

const SRV = { A: [420, 545], B: [1180, 545] };
const IP_SRV = { A: '203.0.113.10', B: '198.51.100.7' };
const REFS = [
  { id: 'ref1', x: 60, y: 110, t: 'Enlace en la web de un cliente', ip: 'http://203.0.113.10/', n: 'http://www.miempresa.es/' },
  { id: 'ref2', x: 60, y: 250, t: 'Cartel con código QR', ip: 'http://203.0.113.10/', n: 'http://www.miempresa.es/' },
  { id: 'ref3', x: 1190, y: 110, t: 'App móvil ya instalada', ip: 'servidor = 203.0.113.10', n: 'servidor = www.miempresa.es' },
  { id: 'ref4', x: 1190, y: 250, t: 'Configuración de un socio', ip: 'api = 203.0.113.10', n: 'api = www.miempresa.es' },
];

function mapaRed(o = {}) {
  const srv = o.srv || 'A', r = [];
  if (o.refs) {
    let html = '';
    for (const f of REFS) {
      const izq = f.x < 800, x1 = izq ? f.x + 350 : f.x, y1 = f.y + 38;
      let x2, y2, cls;
      if (o.refs === 'nombre') { x2 = izq ? 670 : 930; y2 = 455; cls = 'nombre'; }
      else { x2 = izq ? 305 : 535; y2 = 545; cls = o.refs === 'rota' ? 'mal' : 'ip'; }
      html += flecha(x1, y1, x2, y2, cls, { dash: true, fino: true, fin: 4 });
    }
    r.push(S('ref-enlaces-' + o.refs, 0, 0, html));
  }
  r.push(S('nube', 0, 0, `<ellipse cx="800" cy="215" rx="300" ry="100" class="nube"/>` + txt('Internet', { x: 800, y: 150, size: 20, cls: 'ns' })));
  r.push(S('enlaces-red', 0, 0, linea(650, 285, 950, 285, 'enlace') + linea(650, 285, 470, 400, 'enlace') + linea(950, 285, 1130, 400, 'enlace')));
  r.push(S('r1', 650, 285, `<circle r="22" class="router"/>` + txt('R', { y: 7, size: 18, weight: 600 })));
  r.push(S('r2', 950, 285, `<circle r="22" class="router"/>` + txt('R', { y: 7, size: 18, weight: 600 })));
  for (const [id, x, nombre, pref] of [['ispA', 110, 'ISP A', '203.0.113.x'], ['ispB', 950, 'ISP B', '198.51.100.x']]) {
    r.push(S(id, 0, 0, `<rect x="${x}" y="400" width="540" height="340" rx="14" class="isp"/>` +
      txt(nombre, { x: x + 20, y: 432, anchor: 'start', size: 22, weight: 700, cls: 'c-ip' }) +
      txt(pref, { x: x + 20, y: 460, anchor: 'start', size: 19, cls: 'mono c-ip' })));
  }
  for (const [id, x, ip] of [['hA1', 220, '203.0.113.25'], ['hA2', 500, '203.0.113.40'], ['hB1', 1060, '198.51.100.40'], ['hB2', 1340, '198.51.100.41']]) {
    r.push(S(id, x, 670, nodo('Equipo', ip, { w: 180, h: 62, size: 18 })));
  }
  if (o.refs === 'rota') r.push(S('fantasma', ...SRV.A, caja(230, 70, { cls: 'fantasma' }) + txt('aquí ya no hay nadie', { y: 7, size: 18, cls: 'c-mal' })));

// Motor: render por diferencias sobre el SVG, vuelos de mensajes y navegación.

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

// ───────────── Render por diferencias ─────────────
const vivos = new Map();

function render(specs, instantaneo) {
  const capa = $('dns-capa'), vistos = new Set();
  let prev = null;
  for (const sp of specs) {
    if (vistos.has(sp.id)) console.warn('[dns] id repetido', sp.id);
    vistos.add(sp.id);
    let el = vivos.get(sp.id), nuevo = false;
    if (!el) {
      el = document.createElementNS(SVGNS, 'g');
      el.dataset.id = sp.id;
      vivos.set(sp.id, el);
      nuevo = true;
    }
    if (el._html !== sp.html) { el.innerHTML = sp.html; el._html = sp.html; }
    el.setAttribute('class', 'el ' + sp.cls);
    const tr = `translate(${sp.x}px, ${sp.y}px)`;
    const ref = prev ? prev.nextSibling : capa.firstChild;
    if (ref !== el) capa.insertBefore(el, ref);
    if (nuevo) {
      el.style.transition = 'none';
      el.style.opacity = 0;
      el.style.transform = tr;
      el.getBoundingClientRect();
      el.style.transition = '';
      el.style.transitionDelay = instantaneo ? '0ms' : sp.d + 'ms';
    } else {
      el.style.transitionDelay = '0ms';
      el.style.transform = tr;
    }
    el.style.opacity = sp.op;
    prev = el;
  }
  for (const [id, el] of vivos) {
    if (vistos.has(id)) continue;
    vivos.delete(id);
    el.style.transitionDelay = '0ms';
    el.style.opacity = 0;
    setTimeout(() => el.remove(), 450);
  }
}

  generacion++;
  temporizadores.forEach(clearTimeout);
  temporizadores = [];
  $('dns-vuelos').innerHTML = '';
}

function volar(v) {
  const gen = generacion;
  temporizadores.push(setTimeout(() => {
    if (gen !== generacion) return;
    const g = document.createElementNS(SVGNS, 'g');
    const w = anchoTexto(v.etiqueta, 16, true) + 22;
    g.innerHTML = `<rect x="${-w / 2}" y="-16" width="${w}" height="32" rx="16" class="sobre ${v.cls}"/>` + txt(v.etiqueta, { y: 6, size: 16, cls: 'mono sobre-t' });
    $('dns-vuelos').appendChild(g);
    const t0 = performance.now();
    const paso = ahora => {
      if (gen !== generacion) return;
      let k = Math.min(1, (ahora - t0) / v.dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      g.setAttribute('transform', `translate(${v.de[0] + (v.a[0] - v.de[0]) * e},${v.de[1] + (v.a[1] - v.de[1]) * e})`);
      if (k < 1) requestAnimationFrame(paso);
      else temporizadores.push(setTimeout(() => g.remove(), 150));
    };
    requestAnimationFrame(paso);
  }, v.t));
}

// ───────────── Navegación ─────────────
let actual = -1;

function construir(i) {
  return [...marco(PASOS[i], i, PASOS.length), ...PASOS[i].escena()];
}

function ir(i, animar) {
  i = Math.max(0, Math.min(PASOS.length - 1, i));
  cancelarVuelos();
  render(construir(i), !animar);
  if (animar) (PASOS[i].vuelos || []).forEach(volar);
  actual = i;
  try { history.replaceState(null, '', '#p' + (i + 1)); } catch (e) { /* sin historial (incrustado) */ }
  pintarControles();
}

const siguiente = () => { if (actual < PASOS.length - 1) ir(actual + 1, true); };
const anterior = () => ir(actual - 1, false);

function repetir() {
  if (actual <= 0) return ir(actual, true);
  const i = actual;
  render(construir(i - 1), true);
  setTimeout(() => ir(i, true), 350);
}

function pintarControles() {
  $('dns-cont').textContent = `${actual + 1} / ${PASOS.length}`;
  $('dns-indice').value = String(actual);
}

// ───────────── Teclado y botones ─────────────
function alternarTema() {
  const r = document.documentElement, t = r.getAttribute('data-theme');
  const nuevo = t === 'light' ? 'dark' : t === 'dark' ? null : 'light';
  if (nuevo) r.setAttribute('data-theme', nuevo); else r.removeAttribute('data-theme');
  $('dns-btema').textContent = 'Tema: ' + (nuevo === 'light' ? 'claro' : nuevo === 'dark' ? 'oscuro' : 'auto');
}

function pantallaCompleta() {
  const e = $('dns-escenario');
  if (document.fullscreenElement) document.exitFullscreen(); else if (e.requestFullscreen) e.requestFullscreen();
}

function teclado(accion) {
  return ev => {
    if (ev.target && /^(SELECT|INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { ev.preventDefault(); accion('sig'); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { ev.preventDefault(); accion('ant'); }
    else if (k === 'r' || k === 'R') accion('rep');
    else if (k === 'Home') accion('ini');
    else if (k === 'End') accion('fin');
    else if (k === 'f' || k === 'F') accion('fs');
  };
}

function iniciar() {
  const sel = $('dns-indice');
  let actoPrevio = '';
  PASOS.forEach((p, i) => {
    if (p.acto !== actoPrevio) {
      const og = document.createElement('optgroup');
      og.label = `Acto ${p.acto} · ${ACTOS[p.acto]}`;
      sel.appendChild(og);
      actoPrevio = p.acto;
    }
    const op = document.createElement('option');
    op.value = String(i);
    op.textContent = `${i + 1}. ${p.titulo}`;
    sel.lastChild.appendChild(op);
  });
  sel.onchange = () => { ir(+sel.value, false); sel.blur(); };
  $('dns-ant').onclick = anterior;
  $('dns-sig').onclick = siguiente;
  $('dns-rep').onclick = repetir;
  $('dns-bfs').onclick = pantallaCompleta;
  $('dns-btema').onclick = alternarTema;
  $('dns-lienzo').addEventListener('click', siguiente);
  document.addEventListener('keydown', teclado(a => ({
    sig: siguiente, ant: anterior, rep: repetir,
    ini: () => ir(0, false), fin: () => ir(PASOS.length - 1, false),
    fs: pantallaCompleta,
  })[a]()));
  const m = /^#p(\d+)$/.exec(location.hash);
  ir(m ? +m[1] - 1 : 0, false);
}

iniciar();
})();
</script>
