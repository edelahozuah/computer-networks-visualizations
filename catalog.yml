- id: dns-names
  topic: 2
  collection: dns
  session: '2.1'
  title:
    es: 'Anatomía de un nombre: de las etiquetas al árbol'
    en: 'Anatomy of a name: from labels to the tree'
  description:
    es: >-
      Descompón cualquier nombre en etiquetas y dominios y míralo en el árbol, desde la raíz o desde el
      nombre. Comprueba las reglas, 63 caracteres, punto final, mayúsculas y punycode.
    en: >-
      Break any name into labels and domains and see it in the tree, from the root or from the name. Check
      the rules, 63 characters, trailing dot, case and punycode.
  summary:
    es: >-
      Descompone un nombre de dominio en sus etiquetas y lo sitúa en el árbol del DNS. El estudiante escribe
      un nombre o elige un ejemplo, y recorre los niveles desde la raíz hacia abajo o desde el nombre
      hacia arriba, con una pausa opcional para predecir. Cada sufijo se muestra como un dominio, con
      su padre y una explicación del TLD y del dominio de segundo nivel. Un panel comprueba las reglas:
      63 caracteres por etiqueta, 253 en total, letras, cifras y guiones, punto final, mayúsculas y punycode.
      Enseña que un nombre se escribe de lo particular a lo general y el árbol se recorre desde la raíz.
    en: >-
      Breaks a domain name into its labels and places it in the DNS tree. The student types a name or
      picks an example, and walks the levels from the root downwards or from the name upwards, with an
      optional pause to predict. Each suffix is shown as a domain, with its parent and an explanation
      of the TLD and of the second-level domain. A panel checks the rules: 63 characters per label, 253
      in total, letters, digits and hyphens, trailing dot, case and punycode. It teaches that a name is
      written from the specific to the general and the tree is walked from the root.
  concepts:
    es:
    - etiqueta
    - dominio
    - árbol de nombres
    - raíz
    - dominio de nivel superior (TLD)
    - nombre completo (FQDN)
    - punycode
    - host
    en:
    - label
    - domain
    - name tree
    - root
    - top-level domain (TLD)
    - fully qualified domain name (FQDN)
    - punycode
    - host
  files:
    es: 02-application-layer/dns/dns-names.es.html
    en: 02-application-layer/dns/dns-names.en.html
  thumbnail: thumbnails/dns-names.jpg
  added: '2026-09-28'
- id: dns-zone-delegation
  topic: 2
  collection: dns
  session: '2.1'
  title:
    es: 'Delegación de zonas: ceder una rama del árbol'
    en: DNS zone delegation
  description:
    es: >-
      Paso a paso de la cadena IANA → Red.es → UAH → Departamento, con los ficheros de zona. En «Delega
      tú» creas dominios y hosts y los cedes tú mismo, con NS, pegamento y referencias.
    en: >-
      Step by step through the IANA → Red.es → UAH → Department chain, with zone files. In "Delegate it
      yourself" you create domains and hosts and delegate them yourself, with NS records, glue and referrals.
  summary:
    es: >-
      Muestra cómo se reparte el espacio de nombres DNS en zonas mediante delegación, con la cadena IANA,
      Red.es, UAH y departamentos. En «Paso a paso» se ve el árbol coloreado por zonas y los ficheros
      de zona (SOA, NS, A) cambiando en cada delegación, con una pausa opcional para predecir. En «Delega
      tú» el estudiante actúa como cada responsable, crea dominios y hosts, cede ramas indicando servidor
      y dirección, y ve cuándo el registro de pegamento (glue) es obligatorio. Al pulsar un nombre se
      muestra la cadena de referencias hasta su servidor autoritativo. Distingue dominio y zona.
    en: >-
      Shows how the DNS name space is split into zones through delegation, using the chain IANA, Red.es,
      UAH and departments. In "Step by step" the tree is coloured by zone and the zone files (SOA, NS,
      A) change with each delegation, with an optional pause to predict. In "Your turn" the student acts
      as each zone owner, creates domains and hosts, hands over branches by giving a server name and address,
      and sees when the glue record is mandatory. Clicking a name shows the chain of referrals leading
      to its authoritative server. It distinguishes a domain from a zone.
  concepts:
    es:
    - delegación de zona
    - zona
    - registro NS
    - registro de pegamento (glue)
    - servidor autoritativo
    - fichero de zona
    - referencia
    - dominio frente a zona
    en:
    - zone delegation
    - zone
    - NS record
    - glue record
    - authoritative server
    - zone file
    - referral
    - domain versus zone
  files:
    es: 02-application-layer/dns/dns-zone-delegation.es.html
    en: 02-application-layer/dns/dns-zone-delegation.en.html
  thumbnail: thumbnails/dns-zone-delegation.jpg
  added: '2026-09-28'
- id: dns-queries
  topic: 2
  collection: dns
  session: '2.1'
  title:
    es: 'Consultas DNS: iterativa y recursiva'
    en: 'DNS queries: iterative and recursive'
  description:
    es: >-
      Mensaje a mensaje, la resolución de gaia.cs.umass.edu con la caché vacía. Compara los dos modos
      y fíjate en quién tiene que recordar consultas ajenas.
    en: >-
      Message by message, resolving gaia.cs.umass.edu with an empty cache. Compare the two modes and notice
      who has to remember other people's queries.
  summary:
    es: >-
      Animación mensaje a mensaje de la resolución de gaia.cs.umass.edu por un host, con todas las cachés
      vacías, en un escenario de host, resolutor local, servidor raíz, servidor TLD .edu y servidor autoritativo.
      Tiene tres modos: iterativa, recursiva y comparar ambas. Cada uno de los 8 mensajes indica su tipo
      (consulta, referencia o respuesta), sus campos (RD, AA, TTL) y lo que se guarda en caché, y marca
      qué servidores mantienen una consulta ajena pendiente. Muestra que en la práctica solo la primera
      consulta es recursiva, y que la raíz y los TLD responden con referencias para no acumular consultas
      pendientes.
    en: >-
      Message-by-message animation of how a host resolves gaia.cs.umass.edu with every cache empty, in
      a scenario made of a host, a local DNS server, a root server, a .edu TLD server and an authoritative
      server. It has three modes: iterative, recursive and a side-by-side comparison. Each of the 8 messages
      states its type (query, referral or answer), its fields (RD, AA, TTL) and what gets cached, and
      marks which servers hold someone else's query pending. It shows that in practice only the first
      query is recursive, and that root and TLD servers reply with referrals so that they do not accumulate
      pending queries.
  concepts:
    es:
    - consulta iterativa
    - consulta recursiva
    - resolutor local
    - referencia
    - servidor autoritativo
    - caché
    - TTL
    - servidor raíz
    en:
    - iterative query
    - recursive query
    - local DNS server
    - referral
    - authoritative server
    - cache
    - TTL
    - root server
  files:
    es: 02-application-layer/dns/dns-queries.es.html
    en: 02-application-layer/dns/dns-queries.en.html
  thumbnail: thumbnails/dns-queries.jpg
  added: '2026-09-28'
- id: dns-queries-mixed
  topic: 2
  collection: dns
  session: '2.1'
  title:
    es: 'Consultas DNS: decide tú quién es recursivo'
    en: 'DNS queries: you decide who is recursive'
  description:
    es: >-
      La misma resolución, pero tú eliges si el servidor local, la raíz, el TLD y el autoritativo atienden
      de forma recursiva o iterativa. Compara quién envía las consultas, quién tiene que esperar y dónde
      acaba la respuesta en caché.
    en: >-
      The same resolution, but you choose whether the local server, the root, the TLD and the authoritative
      server work recursively or iteratively. Compare who sends the queries, who has to wait and where
      the answer ends up cached.
  summary:
    es: >-
      Amplía las figuras 2.19 y 2.20 de Kurose y Ross: la resolución de gaia.cs.umass.edu con las cachés
      vacías, pero el estudiante decide si cada servidor (local, raíz, TLD .edu y autoritativo) atiende
      las consultas que recibe de forma recursiva o iterativa, en el panel o pulsando la etiqueta de cada
      servidor en el dibujo. La animación genera los 8 mensajes de esa configuración, con su tipo (consulta,
      referencia o respuesta), los campos RD, RA y AA y lo que se guarda en caché, y marca qué servidores
      tienen que recordar una consulta ajena. Al final, una tabla compara cuántos mensajes y consultas
      ha enviado cada equipo y quién ha esperado. Muestra que el número de mensajes no cambia, sino quién
      hace el trabajo, y por qué en la práctica solo el servidor local es recursivo.
    en: >-
      An extension of Figs. 2.19 and 2.20 in Kurose and Ross: resolving gaia.cs.umass.edu with every cache
      empty, but the student decides whether each server (local, root, .edu TLD and authoritative) handles
      the queries it receives recursively or iteratively, in the panel or by clicking the label next to
      each server in the diagram. The animation builds the 8 messages for that configuration, with their
      type (query, referral or answer), the RD, RA and AA fields and what gets cached, and marks which
      servers have to remember someone else's query. At the end, a table compares how many messages and
      queries each device sent and who had to wait. It shows that the number of messages does not change,
      only who does the work, and why in practice only the local server is recursive.
  concepts:
    es:
    - consulta iterativa
    - consulta recursiva
    - resolutor local
    - referencia
    - servidor raíz
    - servidor TLD
    - servidor autoritativo
    - caché
    - bit RD
    - bit RA
    - bit AA
    - consulta pendiente
    en:
    - iterative query
    - recursive query
    - local DNS server
    - referral
    - root server
    - TLD server
    - authoritative server
    - cache
    - RD bit
    - RA bit
    - AA bit
    - pending query
  files:
    es: 02-application-layer/dns/dns-queries-mixed.es.html
    en: 02-application-layer/dns/dns-queries-mixed.en.html
  thumbnail: thumbnails/dns-queries-mixed.jpg
  added: '2026-09-28'
- id: dns-step-by-step
  topic: 2
  collection: dns
  session: '2.2'
  title:
    es: DNS paso a paso
    en: DNS step by step
  description:
    es: >-
      El DNS contado desde el porqué en 27 pasos, de por qué la IP no basta al recorrido de una consulta
      mensaje a mensaje. Por qué hacen falta nombres, cómo se reparte el árbol, qué ve tu equipo y qué
      pasa detrás, y dónde es recursiva o iterativa cada consulta.
    en: >-
      The DNS told from the why in 27 steps, from why an IP address is not enough to a query followed
      message by message. Why we need names, how the tree is split up, what your computer sees and what
      happens behind it, and where each query is recursive or iterative.
  summary:
    es: >-
      Animación por pasos que cuenta el DNS desde el porqué en seis actos y 27 pasos. La dirección IP
      dice dónde está un equipo y depende de su proveedor, así que al mudarse se rompe todo lo que la
      tenía apuntada; un nombre añade un nivel de indirección que administra su dueño. La tabla de nombres
      empieza como un fichero central (HOSTS.TXT) que no escala y pasa a ser una base de datos distribuida,
      jerárquica y delegada en zonas, cuyo árbol no coincide con el de direcciones. El equipo final solo
      hace una pregunta al resolutor local y espera; detrás, el resolutor local recorre raíz, TLD .es
      y servidor autoritativo para resolver www.rediris.es, con referencias, pegamento (glue), los bits
      RD, RA y AA y la caché, en un mapa y un diagrama de secuencia que se construyen a la vez. Después
      muestra que recursiva e iterativa se dice de cada pareja consulta-respuesta, qué pasaría si todo
      fuese recursivo o todo iterativo, y termina con los ocho mensajes, su destino y sus secciones (Question,
      Answer, Authority, Additional).
    en: >-
      A step-by-step animation that tells the story of the DNS from the why in six acts and 27 steps.
      An IP address says where a host is and depends on its provider, so moving breaks everything that
      had it written down; a name adds a level of indirection managed by its owner. The name table starts
      as a central file (HOSTS.TXT) that does not scale and becomes a distributed, hierarchical database
      delegated in zones, whose tree does not match the address tree. The end host only asks the local
      resolver one question and waits; behind it, the local resolver walks the root, the .es TLD and the
      authoritative server to resolve www.rediris.es, with referrals, glue, the RD, RA and AA bits and
      the cache, on a map and a sequence diagram built side by side. It then shows that recursive and
      iterative describe each query-response pair, what would happen if everything were recursive or everything
      iterative, and ends with the eight messages, their destination and their sections (Question, Answer,
      Authority, Additional).
  concepts:
    es:
    - dirección IP
    - nivel de indirección
    - nombre de dominio
    - registro A
    - TTL
    - HOSTS.TXT
    - árbol de nombres
    - zona
    - delegación
    - resolutor del sistema (stub)
    - resolutor local
    - servidor raíz
    - servidor TLD
    - servidor autoritativo
    - referencia
    - registro de pegamento (glue)
    - caché
    - consulta recursiva
    - consulta iterativa
    - bit RD
    - bit RA
    - bit AA
    - diagrama de secuencia
    en:
    - IP address
    - level of indirection
    - domain name
    - A record
    - TTL
    - HOSTS.TXT
    - name tree
    - zone
    - delegation
    - stub resolver
    - local resolver
    - root server
    - TLD server
    - authoritative server
    - referral
    - glue record
    - cache
    - recursive query
    - iterative query
    - RD bit
    - RA bit
    - AA bit
    - sequence diagram
  files:
    es: 02-application-layer/dns/dns-step-by-step.es.html
    en: 02-application-layer/dns/dns-step-by-step.en.html
