- id: dns-names
  topic: 2
  collection: dns
  session: '2.1'
  title:
    es: 'Anatomía de un nombre: de las etiquetas al árbol'
    en: 'Anatomy of a name: from labels to the tree'
  description:
    es: >-
      Descompón cualquier nombre en etiquetas y dominios y míralo en el árbol, desde la raíz o desde el
      nombre. Comprueba las reglas, 63 caracteres, punto final, mayúsculas y punycode.
    en: >-
      Break any name into labels and domains and see it in the tree, from the root or from the name. Check
      the rules, 63 characters, trailing dot, case and punycode.
  summary:
    es: >-
      Descompone un nombre de dominio en sus etiquetas y lo sitúa en el árbol del DNS. El estudiante escribe
      un nombre o elige un ejemplo, y recorre los niveles desde la raíz hacia abajo o desde el nombre
      hacia arriba, con una pausa opcional para predecir. Cada sufijo se muestra como un dominio, con
      su padre y una explicación del TLD y del dominio de segundo nivel. Un panel comprueba las reglas:
      63 caracteres por etiqueta, 253 en total, letras, cifras y guiones, punto final, mayúsculas y punycode.
      Enseña que un nombre se escribe de lo particular a lo general y el árbol se recorre desde la raíz.
    en: >-
      Breaks a domain name into its labels and places it in the DNS tree. The student types a name or
      picks an example, and walks the levels from the root downwards or from the name upwards, with an
      optional pause to predict. Each suffix is shown as a domain, with its parent and an explanation
      of the TLD and of the second-level domain. A panel checks the rules: 63 characters per label, 253
      in total, letters, digits and hyphens, trailing dot, case and punycode. It teaches that a name is
      written from the specific to the general and the tree is walked from the root.
  concepts:
