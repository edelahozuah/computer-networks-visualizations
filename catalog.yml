- id: transport-demultiplexing
  topic: 3
  collection: multiplexing
  session: '3.1'
  title:
    es: '¿A qué socket va? Demultiplexación UDP y TCP'
    en: 'Which socket? UDP and TCP demultiplexing'
  description:
    es: >-
      Los clientes A, B y D envían segmentos al servidor C, que elige el socket con la cabecera: UDP solo mira
      el destino (IP_D, PD); TCP, los cuatro valores. Socket de bienvenida y de conexión, respuesta con los
      puertos intercambiados, puertos efímeros, modo predicción y ejercicios.
    en: >-
      Clients A, B and D send segments to server C, which chooses the socket from the header: UDP only looks at
      the destination (IP_D, PD); TCP at the four values. Welcome and connection sockets, the reply with swapped
      ports, ephemeral ports, prediction mode and exercises.
  summary:
    es: >-
      Visualización de la demultiplexación en la capa de transporte. Tres hosts cliente (A, B y D) envían
      segmentos con la cabecera visible (Protocolo, IP_O, IP_D, PO, PD) a un servidor C, dentro del cual se ve la
      tabla de sockets. Con UDP el socket se identifica solo por el destino (IP_D, PD): todos los segmentos al
      mismo puerto entran por un único socket, vengan de donde vengan. Con TCP hay un socket de bienvenida por
      puerto en escucha y un socket de conexión por cada 4-tupla (IP_O, PO, IP_D, PD) distinta, de modo que el
      mismo puerto origen desde dos IP distintas da dos sockets. Un interruptor pasa los mismos segmentos de UDP
      a TCP. El botón Responder muestra la respuesta del servidor con IP y puertos intercambiados: el puerto
      origen es la dirección de retorno. «Nuevo cliente» añade un segmento con un puerto efímero elegido por el
      SO en el rango de la IANA (49152–65535) o de Linux (32768–60999). Escenarios de las diapositivas: UDP con dos
      clientes y un socket, TCP «uno a uno» (un proceso por conexión), «uno a varios» (hilos), un servidor web
      por eventos con HTTP/2 y HTTP/1.1, y 443/TCP junto a 443/UDP, con la vista de tres niveles de
      direccionamiento (IP, Protocolo 6/17, puerto). Incluye modo predicción, ejercicios aleatorios y la pregunta
      final de cuántos sockets tiene el servidor.
    en: >-
      A visualization of transport-layer demultiplexing. Three client hosts (A, B and D) send segments with a
      visible header (Protocol, source and destination IP, source and destination port) to a server C, inside
      which the socket table is shown. With UDP the socket is identified only by the destination (IP_D, PD):
      every segment to the same port goes into a single socket, wherever it comes from. With TCP there is a
      welcome socket per listening port and one connection socket per distinct 4-tuple (IP_O, PO, IP_D, PD), so
      the same source port from two different IPs gives two sockets. A switch turns the same segments from UDP
      into TCP. The Reply button shows the server's reply with IPs and ports swapped: the source port is the
      return address. “New client” adds a segment with an ephemeral port chosen by the OS in the IANA range
      (49152–65535) or the Linux one (32768–60999). Scenarios from the slides: UDP with two clients and one
      socket, TCP “one to one” (one process per connection), “one to many” (threads), an event-driven web
      server with HTTP/2 and HTTP/1.1, and 443/TCP next to 443/UDP, with the three addressing levels view (IP,
      Protocol 6/17, port). It includes prediction mode, random exercises and a final question on how many
      sockets the server has.
  concepts:
    es:
    - demultiplexación
    - multiplexación
    - socket UDP
    - socket TCP
    - socket de bienvenida
    - socket de conexión
    - 4-tupla
    - puerto origen y puerto destino
    - puertos efímeros
    - dirección de retorno
    - campo Protocolo (6/17)
    - procesos e hilos del servidor
    en:
    - demultiplexing
    - multiplexing
    - UDP socket
    - TCP socket
    - welcome socket
    - connection socket
    - 4-tuple
    - source and destination port
    - ephemeral ports
    - return address
    - Protocol field (6/17)
    - server processes and threads
  formulas:
    es:
    - 'Socket UDP = (IP_D, PD)'
    - 'Socket de conexión TCP = (IP_O, PO, IP_D, PD)'
    - 'Sockets TCP en el servidor = sockets de bienvenida + nº de 4-tuplas distintas'
    - 'Respuesta: (IP_O, PO, IP_D, PD) → (IP_D, PD, IP_O, PO)'
    en:
    - 'UDP socket = (IP_D, PD)'
    - 'TCP connection socket = (IP_O, PO, IP_D, PD)'
    - 'TCP sockets in the server = welcome sockets + number of distinct 4-tuples'
    - 'Reply: (IP_O, PO, IP_D, PD) → (IP_D, PD, IP_O, PO)'
  files:
    es: 03-transport-layer/transport-demultiplexing.es.html
    en: 03-transport-layer/transport-demultiplexing.en.html
  thumbnail: thumbnails/transport-demultiplexing.jpg
  source: src/transport-demultiplexing
  added: '2026-10-17'
- id: udp-checksum
  topic: 3
  collection: udp
  session: '3.1'
  title:
    es: Checksum UDP paso a paso
    en: UDP checksum step by step
  description:
    es: >-
      Suma en complemento a 1 de palabras de 16 bits, columna a columna: el acarreo que sale por la
      izquierda da la vuelta y se suma por la derecha, y al final se invierten los bits. Comprueba el
      checksum como receptor de las dos formas y cambia bits en el canal para ver qué errores se detectan.
    en: >-
      One's complement sum of 16-bit words, column by column: the carry that leaves on the left wraps
      around and is added on the right, and at the end the bits are inverted. Check the checksum as the
      receiver in both ways and flip bits in the channel to see which errors are detected.
  summary:
    es: >-
      Calculadora animada del checksum de UDP (Kurose y Ross §3.3.2, RFC 768 y RFC 1071) sin pseudocabecera.
      Entre 2 y 6 palabras de 16 bits, editables en hexadecimal o en binario o bit a bit, se suman de dos en
      dos en complemento a 1, columna a columna o suma a suma, con los acarreos internos visibles; el acarreo
      que sale por la izquierda (el bit 17) da la vuelta y se suma al bit de menor peso, y al final se
      invierten todos los bits para obtener el checksum. Un interruptor añade un byte de relleno a 0 cuando el
      número de bytes es impar, que entra en la suma pero no se transmite. El receptor comprueba el segmento
      de dos formas equivalentes: sumando todas las palabras con el checksum incluido (sin error sale FFFF) o
      poniendo el campo a 0, recalculando y comparando. Un canal con errores permite voltear bits de las
      palabras recibidas: un error de un bit se detecta siempre, mientras que dos bits que se compensan en la
      misma columna pasan sin detectar, por lo que la capa de enlace añade un CRC. Incluye el ejemplo del
      libro, palabras aleatorias y un modo de práctica en el que se escribe el checksum en hexadecimal.
    en: >-
      An animated calculator of the UDP checksum (Kurose and Ross §3.3.2, RFC 768 and RFC 1071) without the
      pseudo-header. Between 2 and 6 16-bit words, editable in hexadecimal, in binary or bit by bit, are
      summed two at a time in one's complement, column by column or one sum at a time, with the internal
      carries visible; the carry that leaves on the left (the 17th bit) wraps around and is added to the
      least significant bit, and at the end every bit is inverted to obtain the checksum. A switch adds a
      zero padding byte when the number of bytes is odd, which takes part in the sum but is not transmitted.
      The receiver checks the segment in two equivalent ways: summing every word including the checksum (with
      no error the result is FFFF) or setting the field to 0, recomputing and comparing. A channel with errors
      lets you flip bits of the received words: a one-bit error is always detected, whereas two bits that
      cancel out in the same column go undetected, which is why the link layer adds a CRC. It includes the
      book example, random words and a practice mode in which the checksum is typed in hexadecimal.
  concepts:
    es:
    - checksum UDP
    - suma en complemento a 1
    - acarreo circular
    - complemento a 1
    - palabras de 16 bits
    - byte de relleno
    - verificación en el receptor
    - detección de errores extremo a extremo
    - errores no detectados
    - CRC
    en:
    - UDP checksum
    - one's complement sum
    - end-around carry
    - one's complement
    - 16-bit words
    - padding byte
    - receiver verification
    - end-to-end error detection
    - undetected errors
    - CRC
  formulas:
    es:
    - suma = Σ palabras en complemento a 1 (el acarreo del bit 17 se suma al bit 0)
    - checksum = ~suma (se invierten los 16 bits)
    - 'receptor: Σ palabras + checksum = FFFF si no se detecta error'
    en:
    - sum = Σ words in one's complement (the carry out of bit 16 is added to bit 0)
    - checksum = ~sum (all 16 bits inverted)
    - 'receiver: Σ words + checksum = FFFF if no error is detected'
  files:
    es: 03-transport-layer/udp-checksum.es.html
    en: 03-transport-layer/udp-checksum.en.html
  thumbnail: thumbnails/udp-checksum.jpg
  source: src/udp-checksum
  added: '2026-10-17'
- id: udp-datagram
  topic: 3
  collection: udp
  session: '3.1'
  title:
    es: El datagrama UDP y su pseudocabecera
    en: The UDP datagram and its pseudo-header
  description:
    es: >-
      La cabecera UDP en filas de 32 bits, con la explicación de cada campo. Cambia la carga útil y mira cómo
      se actualiza la Longitud y dónde están los límites; construye la pseudocabecera a partir de la cabecera
      IPv4 y sigue los tres niveles de direccionamiento: IP, protocolo 6/17 y puerto.
    en: >-
      The UDP header in 32-bit rows, with an explanation of each field. Change the payload and watch the
      Length update and where the limits are; build the pseudo-header from the IPv4 header and follow the
      three levels of addressing: IP, protocol 6/17 and port.
  summary:
    es: >-
      Visualización del datagrama UDP (Kurose y Ross §3.3, RFC 768). El segmento se dibuja en filas de 32 bits:
      una cabecera de 8 B con cuatro campos de 16 bits (puerto origen, puerto destino, longitud y checksum) y
      los datos; al pasar el ratón o el foco por cada campo se muestra su significado. Un deslizador de carga
      útil actualiza la Longitud (cabecera + datos, entre 8 y 65 535 B) y el tamaño del datagrama IPv4, y marca
      los límites: 8 B sin datos, 65 527 B de datos como máximo del campo Longitud y 65 507 B sobre IPv4 por
      los 20 B de su cabecera. Una animación construye la pseudocabecera de 12 B: de la cabecera IPv4 bajan
      la IP origen, la IP destino y el protocolo 17, se añaden un byte a cero y la longitud UDP, y se marca que
      no se transmite porque cada extremo la reconstruye; protege también a quién iba dirigido el datagrama.
      El cálculo del checksum se deja para el laboratorio. Una cascada interactiva muestra los tres niveles de
      direccionamiento de un host: la dirección IP, el campo Protocolo (6 = TCP, 17 = UDP) y el número de
      puerto, por lo que 443/TCP y 443/UDP pueden convivir. Incluye preguntas de práctica sobre tamaños.
    en: >-
      A visualization of the UDP datagram (Kurose and Ross §3.3, RFC 768). The segment is drawn in 32-bit rows:
      an 8-byte header with four 16-bit fields (source port, destination port, length and checksum) and the
      data; hovering over or focusing each field shows what it means. A payload slider updates the Length
      (header + data, between 8 and 65 535 B) and the size of the IPv4 datagram, and marks the limits: 8 B with
      no data, 65 527 B of data as the maximum of the Length field and 65 507 B over IPv4 because of its 20-byte
      header. An animation builds the 12-byte pseudo-header: the source IP, the destination IP and protocol 17
      come down from the IPv4 header, a zero byte and the UDP length are added, and it is marked as not
      transmitted because each end rebuilds it; it also protects whom the datagram was addressed to. Computing
      the checksum is left to the lab. An interactive cascade shows the three levels of addressing in a host:
      the IP address, the Protocol field (6 = TCP, 17 = UDP) and the port number, which is why 443/TCP and
      443/UDP can coexist. It includes practice questions on sizes.
  concepts:
    es:
    - datagrama UDP
    - cabecera UDP
    - puerto origen
    - puerto destino
    - campo Longitud
    - checksum UDP
    - pseudocabecera
    - carga útil máxima
    - número de protocolo
    - niveles de direccionamiento
    en:
    - UDP datagram
    - UDP header
    - source port
    - destination port
    - Length field
    - UDP checksum
    - pseudo-header
    - maximum payload
    - protocol number
    - addressing levels
  formulas:
    es:
    - Longitud UDP = 8 + datos (8 ≤ L ≤ 65 535)
    - datos máx. = 65 535 − 8 = 65 527 B; sobre IPv4, 65 535 − 20 − 8 = 65 507 B
    - pseudocabecera = IP origen (4) + IP destino (4) + 0x00 (1) + Protocolo 17 (1) + Longitud UDP (2) = 12 B
    en:
    - UDP Length = 8 + data (8 ≤ L ≤ 65 535)
    - max. data = 65 535 − 8 = 65 527 B; over IPv4, 65 535 − 20 − 8 = 65 507 B
    - pseudo-header = source IP (4) + destination IP (4) + 0x00 (1) + Protocol 17 (1) + UDP length (2) = 12 B
  files:
    es: 03-transport-layer/udp-datagram.es.html
    en: 03-transport-layer/udp-datagram.en.html
  thumbnail: thumbnails/udp-datagram.jpg
  source: src/udp-datagram
  added: '2026-10-17'
- id: reliable-data-transfer
  topic: 3
  session: '3.2'
  title:
    es: 'Transferencia fiable: parada y espera, GBN y SR'
    en: 'Reliable data transfer: stop-and-wait, GBN and SR'
  description:
    es: >-
      Diagrama espacio-tiempo de rdt3.0, Retroceder N y Repetición selectiva sobre un canal que pierde,
      corrompe o retrasa paquetes: haz clic en cualquier paquete o ACK para provocar la incidencia y mira
      las ventanas, los temporizadores y las retransmisiones. Modo predicción y ejercicios.
    en: >-
      Space-time diagram of rdt3.0, Go-Back-N and Selective Repeat over a channel that loses, corrupts or
      delays packets: click on any packet or ACK to cause the incident and watch the windows, the timers and
      the retransmissions. Prediction mode and exercises.
  summary:
    es: >-
      Visualización de los principios de la transferencia de datos fiable (Kurose y Ross §3.4). Un emisor
      envía paquetes a un receptor por un canal no fiable y el receptor tiene que entregar los datos una vez y
      en orden. Se dibuja el diagrama espacio-tiempo con el tiempo en unidades de L/R: cada paquete es una banda
      que dura L/R y cada ACK una flecha discontinua; a la izquierda, los temporizadores del emisor. Tres
      protocolos: parada y espera (rdt3.0, bit alternante), Retroceder N (GBN: un temporizador, ACK
      acumulativos, el receptor descarta lo que llega fuera de orden) y Repetición selectiva (SR: un
      temporizador por paquete, ACK individuales y búfer en el receptor). Al hacer clic en un paquete o un ACK
      se pierde, llega con errores de bits o se retrasa, y todo se vuelve a simular. Encima, las ventanas del
      emisor y del receptor en cada instante, con base, nextseqnum y los números de secuencia módulo 2^k.
      Escenarios del libro: las cuatro situaciones de rdt3.0 (Fig. 3.16), el procesamiento en cadena, la
      pérdida de pkt2 en GBN (Fig. 3.22) y en SR (Fig. 3.26), un ACK perdido que salva el ACK acumulativo y las
      ventanas demasiado grandes: N > 2^k − 1 en GBN y N > 2^k/2 en SR (Fig. 3.27), en las que el receptor
      entrega un duplicado como dato nuevo. Se avisa también cuando un retraso desordena el canal. Incluye una
      calculadora de la utilización del emisor, U = N·(L/R)/(RTT + L/R), con el ejemplo del libro (1000 B,
      1 Gbit/s, 30 ms: U = 0,00027), el modo predicción (qué hace el receptor con cada paquete y qué retransmite
      el emisor en cada timeout) y ejercicios aleatorios.
    en: >-
      A visualization of the principles of reliable data transfer (Kurose and Ross §3.4). A sender sends
      packets to a receiver over an unreliable channel and the receiver must deliver the data once and in
      order. The space-time diagram is drawn with time in units of L/R: each packet is a band lasting L/R and
      each ACK a dashed arrow; on the left, the sender's timers. Three protocols: stop-and-wait (rdt3.0,
      alternating bit), Go-Back-N (GBN: one timer, cumulative ACKs, the receiver discards out-of-order
      packets) and Selective Repeat (SR: one timer per packet, individual ACKs and a receiver buffer).
      Clicking on a packet or an ACK makes it lost, corrupted by bit errors or delayed, and everything is
      simulated again. Above, the sender and receiver windows at each moment, with base, nextseqnum and the
      sequence numbers modulo 2^k. Scenarios from the book: the four situations of rdt3.0 (Fig. 3.16),
      pipelining, the loss of pkt2 in GBN (Fig. 3.22) and in SR (Fig. 3.26), a lost ACK saved by the
      cumulative ACK, and windows that are too large: N > 2^k − 1 in GBN and N > 2^k/2 in SR (Fig. 3.27), where
      the receiver delivers a duplicate as new data. It also warns when a delay reorders the channel. It
      includes a calculator of sender utilization, U = N·(L/R)/(RTT + L/R), with the book's example (1000 B,
      1 Gbit/s, 30 ms: U = 0.00027), prediction mode (what the receiver does with each packet and what the
      sender retransmits on each timeout) and random exercises.
  concepts:
    es:
    - transferencia de datos fiable
    - rdt3.0
    - protocolo de bit alternante
    - parada y espera
    - número de secuencia
    - ACK
    - temporizador
    - retransmisión
    - procesamiento en cadena
    - Retroceder N (GBN)
    - Repetición selectiva (SR)
    - ventana deslizante
    - ACK acumulativo
    - utilización del emisor
    en:
    - reliable data transfer
    - rdt3.0
    - alternating-bit protocol
    - stop-and-wait
    - sequence number
    - ACK
    - timer
    - retransmission
    - pipelining
    - Go-Back-N (GBN)
    - Selective Repeat (SR)
    - sliding window
    - cumulative ACK
    - sender utilization
  formulas:
    es:
    - U_emisor = N·(L/R) / (RTT + L/R), como mucho 1 (parada y espera, N = 1)
    - GBN correcto si N ≤ 2^k − 1; SR correcto si N ≤ 2^k / 2
    en:
    - U_sender = N·(L/R) / (RTT + L/R), at most 1 (stop-and-wait, N = 1)
    - GBN is correct if N ≤ 2^k − 1; SR is correct if N ≤ 2^k / 2
  files:
    es: 03-transport-layer/reliable-data-transfer.es.html
    en: 03-transport-layer/reliable-data-transfer.en.html
  thumbnail: thumbnails/reliable-data-transfer.jpg
  source: src/reliable-data-transfer
  added: '2026-10-21'
