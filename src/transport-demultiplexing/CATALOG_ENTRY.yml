# 3) visualization entry:
visualizations_add:
- id: transport-demultiplexing
  topic: 3
  collection: multiplexing
  session: '3.1'
  title:
    es: '¿A qué socket va? Demultiplexación UDP y TCP'
    en: 'Which socket? UDP and TCP demultiplexing'
  description:
    es: >-
      Los clientes A, B y D envían segmentos al servidor C, que elige el socket con la cabecera: UDP solo mira
      el destino (IP_D, PD); TCP, los cuatro valores. Socket de bienvenida y de conexión, respuesta con los
      puertos intercambiados, puertos efímeros, modo predicción y ejercicios.
    en: >-
      Clients A, B and D send segments to server C, which chooses the socket from the header: UDP only looks at
      the destination (IP_D, PD); TCP at the four values. Welcome and connection sockets, the reply with swapped
      ports, ephemeral ports, prediction mode and exercises.
  summary:
    es: >-
      Visualización de la demultiplexación en la capa de transporte. Tres hosts cliente (A, B y D) envían
      segmentos con la cabecera visible (Protocolo, IP_O, IP_D, PO, PD) a un servidor C, dentro del cual se ve la
      tabla de sockets. Con UDP el socket se identifica solo por el destino (IP_D, PD): todos los segmentos al
      mismo puerto entran por un único socket, vengan de donde vengan. Con TCP hay un socket de bienvenida por
      puerto en escucha y un socket de conexión por cada 4-tupla (IP_O, PO, IP_D, PD) distinta, de modo que el
      mismo puerto origen desde dos IP distintas da dos sockets. Un interruptor pasa los mismos segmentos de UDP
      a TCP. El botón Responder muestra la respuesta del servidor con IP y puertos intercambiados: el puerto
      origen es la dirección de retorno. «Nuevo cliente» añade un segmento con un puerto efímero elegido por el
      SO en el rango de la IANA (49152–65535) o de Linux (32768–60999). Escenarios de las diapositivas: UDP con dos
      clientes y un socket, TCP «uno a uno» (un proceso por conexión), «uno a varios» (hilos), un servidor web
      por eventos con HTTP/2 y HTTP/1.1, y 443/TCP junto a 443/UDP, con la vista de tres niveles de
      direccionamiento (IP, Protocolo 6/17, puerto). Incluye modo predicción, ejercicios aleatorios y la pregunta
      final de cuántos sockets tiene el servidor.
    en: >-
      A visualization of transport-layer demultiplexing. Three client hosts (A, B and D) send segments with a
      visible header (Protocol, source and destination IP, source and destination port) to a server C, inside
      which the socket table is shown. With UDP the socket is identified only by the destination (IP_D, PD):
      every segment to the same port goes into a single socket, wherever it comes from. With TCP there is a
      welcome socket per listening port and one connection socket per distinct 4-tuple (IP_O, PO, IP_D, PD), so
      the same source port from two different IPs gives two sockets. A switch turns the same segments from UDP
      into TCP. The Reply button shows the server's reply with IPs and ports swapped: the source port is the
      return address. “New client” adds a segment with an ephemeral port chosen by the OS in the IANA range
      (49152–65535) or the Linux one (32768–60999). Scenarios from the slides: UDP with two clients and one
      socket, TCP “one to one” (one process per connection), “one to many” (threads), an event-driven web
      server with HTTP/2 and HTTP/1.1, and 443/TCP next to 443/UDP, with the three addressing levels view (IP,
      Protocol 6/17, port). It includes prediction mode, random exercises and a final question on how many
      sockets the server has.
