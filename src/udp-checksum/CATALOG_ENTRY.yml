- id: udp-checksum
  topic: 3
  collection: udp
  session: '3.1'
  title:
    es: Checksum UDP paso a paso
    en: UDP checksum step by step
  description:
    es: >-
      Suma en complemento a 1 de palabras de 16 bits, columna a columna: el acarreo que sale por la
      izquierda da la vuelta y se suma por la derecha, y al final se invierten los bits. Comprueba el
      checksum como receptor de las dos formas y cambia bits en el canal para ver qué errores se detectan.
    en: >-
      One's complement sum of 16-bit words, column by column: the carry that leaves on the left wraps
      around and is added on the right, and at the end the bits are inverted. Check the checksum as the
      receiver in both ways and flip bits in the channel to see which errors are detected.
  summary:
    es: >-
      Calculadora animada del checksum de UDP (Kurose y Ross §3.3.2, RFC 768 y RFC 1071) sin pseudocabecera.
      Entre 2 y 6 palabras de 16 bits, editables en hexadecimal o en binario o bit a bit, se suman de dos en
      dos en complemento a 1, columna a columna o suma a suma, con los acarreos internos visibles; el acarreo
      que sale por la izquierda (el bit 17) da la vuelta y se suma al bit de menor peso, y al final se
      invierten todos los bits para obtener el checksum. Un interruptor añade un byte de relleno a 0 cuando el
      número de bytes es impar, que entra en la suma pero no se transmite. El receptor comprueba el segmento
      de dos formas equivalentes: sumando todas las palabras con el checksum incluido (sin error sale FFFF) o
      poniendo el campo a 0, recalculando y comparando. Un canal con errores permite voltear bits de las
      palabras recibidas: un error de un bit se detecta siempre, mientras que dos bits que se compensan en la
      misma columna pasan sin detectar, por lo que la capa de enlace añade un CRC. Incluye el ejemplo del
      libro, palabras aleatorias y un modo de práctica en el que se escribe el checksum en hexadecimal.
    en: >-
      An animated calculator of the UDP checksum (Kurose and Ross §3.3.2, RFC 768 and RFC 1071) without the
      pseudo-header. Between 2 and 6 16-bit words, editable in hexadecimal, in binary or bit by bit, are
      summed two at a time in one's complement, column by column or one sum at a time, with the internal
      carries visible; the carry that leaves on the left (the 17th bit) wraps around and is added to the
      least significant bit, and at the end every bit is inverted to obtain the checksum. A switch adds a
      zero padding byte when the number of bytes is odd, which takes part in the sum but is not transmitted.
      The receiver checks the segment in two equivalent ways: summing every word including the checksum (with
      no error the result is FFFF) or setting the field to 0, recomputing and comparing. A channel with errors
      lets you flip bits of the received words: a one-bit error is always detected, whereas two bits that
      cancel out in the same column go undetected, which is why the link layer adds a CRC. It includes the
      book example, random words and a practice mode in which the checksum is typed in hexadecimal.
  concepts:
    es:
    - checksum UDP
    - suma en complemento a 1
    - acarreo circular
    - complemento a 1
    - palabras de 16 bits
    - byte de relleno
    - verificación en el receptor
    - detección de errores extremo a extremo
    - errores no detectados
    - CRC
    en:
    - UDP checksum
    - one's complement sum
    - end-around carry
    - one's complement
    - 16-bit words
    - padding byte
    - receiver verification
    - end-to-end error detection
    - undetected errors
    - CRC
  formulas:
    es:
    - suma = Σ palabras en complemento a 1 (el acarreo del bit 17 se suma al bit 0)
    - checksum = ~suma (se invierten los 16 bits)
    - 'receptor: Σ palabras + checksum = FFFF si no se detecta error'
    en:
    - sum = Σ words in one's complement (the carry out of bit 16 is added to bit 0)
    - checksum = ~sum (all 16 bits inverted)
    - 'receiver: Σ words + checksum = FFFF if no error is detected'
